<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Летопись — Ведьмак: Праздник бочки (Туссент)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --toussaint-bg: #110709;
            --toussaint-panel: #1e0d11;
            --toussaint-panel-card: #190a0e;
            --wine-dark: #2a0b10;
            --wine-deep: #44121a;
            --gold: #d4af37;
            --gold-light: #fbe8a6;
            --gold-dark: #997a22;
            --text-main: #f0eae1;
            --text-muted: #b5a495;
            --card-border: #c5a03d;
            --card-back-bg: #1c090e;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--toussaint-bg);
            color: var(--text-main);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(85, 21, 32, 0.35) 0%, transparent 60%),
                radial-gradient(circle at 20% 90%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 90%, rgba(140, 40, 55, 0.1) 0%, transparent 50%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            border-bottom: 2px solid transparent;
            border-image: linear-gradient(to right, transparent, var(--gold), transparent) 1;
            background: linear-gradient(to bottom, rgba(30, 13, 17, 0.9), transparent);
        }
        .subtitle-ornament {
            font-family: 'Cinzel', serif;
            color: var(--gold-dark);
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        h1 {
            font-family: 'Cinzel Decorative', serif;
            color: var(--gold-light);
            font-size: 2.6rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.9), 0 0 20px rgba(212, 175, 55, 0.2);
        }
        .sync-status {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 10px;
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
        }
        .sync-status.online { color: #7cb342; }
        .sync-status.syncing { color: var(--gold); }
        .sync-status.error { color: #e53935; }

        .controls-wrapper {
            max-width: 1200px;
            margin: 0 auto 40px auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .search-box {
            width: 100%;
        }
        .search-box input {
            width: 100%;
            padding: 14px 22px;
            background: var(--toussaint-panel);
            border: 2px solid var(--gold-dark);
            color: var(--text-main);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.15rem;
            border-radius: 8px;
            outline: none;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
        }
        .filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .filter-btn {
            background: var(--toussaint-panel);
            border: 1px solid var(--gold-dark);
            color: var(--text-muted);
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 1px;
            border-radius: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .filter-btn:hover, .filter-btn.active {
            background: linear-gradient(135deg, var(--wine-deep), var(--wine-dark));
            color: var(--gold-light);
            border-color: var(--gold);
            font-weight: 600;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            transform: translateY(-1px);
        }
        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 40px;
            justify-items: center;
        }
        
        .card-container {
            width: 270px;
            height: 420px;
            cursor: pointer;
            position: relative;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 12px;
            border: 3px solid var(--card-border);
            overflow: hidden;
            background: var(--toussaint-panel-card);
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
        }
        .card-side {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            transition: opacity 0.3s ease;
        }
        .card.is-front .card-back-side { opacity: 0; pointer-events: none; }
        .card.is-back .card-front-side { opacity: 0; pointer-events: none; }
        .card.is-front .card-front-side { opacity: 1; z-index: 2; }
        .card.is-back .card-back-side { opacity: 1; z-index: 2; pointer-events: auto; }

        .card-image-wrap {
            width: 100%; height: 70%;
            position: relative;
            border-bottom: 2px solid var(--gold-dark);
            overflow: hidden;
            background-color: #0b0507;
        }
        .card-front-side img {
            width: 100%; height: 100%;
            object-fit: contain; object-position: center;
            transition: transform 0.3s ease;
        }
        .card-front-side img:hover { transform: scale(1.03); }
        .zoom-hint {
            position: absolute; bottom: 8px; left: 8px;
            background: rgba(17, 7, 9, 0.8); border: 1px solid var(--gold-dark);
            color: var(--gold-light); font-size: 0.65rem; padding: 3px 6px;
            border-radius: 4px; font-family: 'Cinzel', serif; opacity: 0;
            transition: opacity 0.3s ease; pointer-events: none;
        }
        .card-image-wrap:hover .zoom-hint { opacity: 1; }
        .faction-badge {
            position: absolute; top: 10px; right: 10px;
            background: rgba(17, 7, 9, 0.9); border: 1px solid var(--gold);
            color: var(--gold-light); padding: 5px 10px;
            font-family: 'Cinzel', serif; font-size: 0.7rem; border-radius: 5px;
            letter-spacing: 1.2px; z-index: 2;
        }
        .card-front-info {
            padding: 14px; text-align: center;
            background: linear-gradient(to bottom, #240b10, #130508);
            flex: 1; display: flex; flex-direction: column; justify-content: center;
        }
        .char-name { font-family: 'Cinzel', serif; color: var(--gold-light); font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
        .player-name { color: var(--text-muted); font-size: 0.95rem; font-style: italic; }
        .flip-hint {
            font-size: 0.7rem; color: var(--gold-dark); margin-top: 6px;
            letter-spacing: 2px; text-transform: uppercase; font-family: 'Cinzel', serif; text-align: center;
        }
        .card-back-side { background: var(--card-back-bg); padding: 16px; }
        .card-back-content {
            border: 1px dashed rgba(212, 175, 55, 0.4); height: 100%;
            padding: 12px; display: flex; flex-direction: column;
            background: rgba(11, 7, 9, 0.4); border-radius: 6px; overflow: hidden;
        }
        .card-back-side h3 {
            font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.05rem;
            border-bottom: 1px solid var(--gold-dark); padding-bottom: 6px; margin-bottom: 8px; text-align: center;
        }
        .card-scroll-area { overflow-y: auto; flex-grow: 1; padding-right: 4px; margin-bottom: 6px; }
        .card-back-side p { font-size: 0.95rem; line-height: 1.5; color: var(--text-main); text-align: justify; white-space: pre-wrap; }
        .empty-notice {
            grid-column: 1 / -1; text-align: center; padding: 60px;
            color: var(--text-muted); font-style: italic; font-size: 1.2rem;
            border: 1px dashed var(--gold-dark); border-radius: 10px; background: rgba(30, 13, 17, 0.4);
        }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 4, 6, 0.88); justify-content: center; align-items: center; z-index: 1000; padding: 20px;
        }
        .close-modal { position: absolute; top: 25px; right: 30px; color: var(--text-muted); cursor: pointer; font-size: 1.8rem; z-index: 10; }
        .image-modal-content {
            background: transparent; border: none; max-width: 90vw; max-height: 90vh;
            display: flex; justify-content: center; align-items: center; padding: 0;
        }
        .image-modal-content img {
            max-width: 100%; max-height: 85vh; border: 3px solid var(--gold);
            border-radius: 8px; object-fit: contain; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
    </style>
</head>
<body>

    <header>
        <div class="subtitle-ornament">Княжество Туссент • Земля любви и вина</div>
        <h1>Праздник Бочки</h1>
        <div id="syncStatus" class="sync-status">Загрузка летописи...</div>
    </header>

    <div class="controls-wrapper">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Поиск благородного гостя или персонажа...">
        </div>
        <div class="filters" id="filterContainer">
            <button class="filter-btn active" data-faction="all">Все благородные</button>
            <button class="filter-btn" data-faction="Княжеский двор">Княжеский двор</button>
            <button class="filter-btn" data-faction="Де Бельгаард">Де Бельгаард</button>
            <button class="filter-btn" data-faction="Де Туффо">Де Туффо</button>
            <button class="filter-btn" data-faction="Де Кастиль Ровелло">Де Кастиль Ровелло</button>
            <button class="filter-btn" data-faction="Послы">Послы</button>
            <button class="filter-btn" data-faction="Межевые рыцари">Межевые рыцари</button>
            <button class="filter-btn" data-faction="Ведьмаки">Ведьмаки</button>
            <button class="filter-btn" data-faction="Последователи Пророка Лебеды">Последователи Пророка Лебеды</button>
            <button class="filter-btn" data-faction="Жрецы Вечного Огня">Жрецы Вечного Огня</button>
            <button class="filter-btn" data-faction="Другие гости праздника">Другие гости праздника</button>
        </div>
    </div>

    <div class="grid" id="cardsGrid"></div>

    <!-- Модальное окно для приближения фото -->
    <div class="modal" id="imageModal">
        <div class="close-modal" id="closeImageModal">&times;</div>
        <div class="modal-content image-modal-content">
            <img id="modalZoomImage" src="" alt="Портрет">
        </div>
    </div>

    <script>
        const BIN_ID = '6ac4cb9dffd5d16053522d13';
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        let roles = [];
        const syncStatus = document.getElementById('syncStatus');
        const grid = document.getElementById('cardsGrid');
        const searchInput = document.getElementById('searchInput');
        const filterContainer = document.getElementById('filterContainer');
        const imageModal = document.getElementById('imageModal');
        const modalZoomImage = document.getElementById('modalZoomImage');
        const closeImageModal = document.getElementById('closeImageModal');

        let currentFaction = 'all';

        async function fetchRoles() {
            syncStatus.textContent = "Загрузка данных летописи...";
            syncStatus.className = "sync-status syncing";
            try {
                const response = await fetch(API_URL, {
                    headers: { 'X-Master-Key': '$2a$10$CaH0kNC6Zc07HLFNngmnwOKb3Ql3tb/WW83pLtLfVASNRBqPObyxW' }
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.record && Array.isArray(data.record.roles)) {
                        roles = data.record.roles;
                    } else if (Array.isArray(data.record)) {
                        roles = data.record;
                    }
                    syncStatus.textContent = "Летопись актуальна";
                    syncStatus.className = "sync-status online";
                    renderRoles();
                } else {
                    throw new Error("Не удалось загрузить данные");
                }
            } catch(e) {
                syncStatus.textContent = "Ошибка загрузки летописи";
                syncStatus.className = "sync-status error";
            }
        }

        function renderRoles() {
            grid.innerHTML = '';
            const searchText = searchInput.value.toLowerCase();

            const filtered = roles.filter(role => {
                const matchesFaction = currentFaction === 'all' || role.faction === currentFaction;
                const matchesSearch = (role.charName || '').toLowerCase().includes(searchText) || (role.playerName || '').toLowerCase().includes(searchText);
                return matchesFaction && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-notice">В данной летописи пока не найдено благородных персон.</div>`;
                return;
            }

            filtered.forEach(role => {
                const cardContainer = document.createElement('div');
                cardContainer.className = 'card-container';
                const photoSrc = role.photo || 'https://via.placeholder.com/300x400?text=No+Photo';
                
                cardContainer.innerHTML = `
                    <div class="card is-front">
                        <div class="card-side card-front-side">
                            <div class="card-image-wrap" data-img="${photoSrc}">
                                <span class="faction-badge">${role.faction}</span>
                                <img src="${photoSrc}" alt="${role.charName}" onerror="this.src='https://via.placeholder.com/300x400?text=No+Photo'">
                                <div class="zoom-hint">Нажмите для приближения</div>
                            </div>
                            <div class="card-front-info">
                                <div class="char-name">${role.charName}</div>
                                <div class="player-name">Игрок: ${role.playerName}</div>
                                <div class="flip-hint">Нажми, чтобы прочитать квенту</div>
                            </div>
                        </div>
                        <div class="card-side card-back-side">
                            <div class="card-back-content">
                                <h3>${role.charName}</h3>
                                <div class="card-scroll-area">
                                    <p>${role.description}</p>
                                </div>
                                <div class="flip-hint">Вернуть карточку</div>
                            </div>
                        </div>
                    </div>
                `;

                const cardElement = cardContainer.querySelector('.card');
                
                cardContainer.addEventListener('click', (e) => {
                    if (e.target.closest('.card-image-wrap')) return;
                    cardElement.classList.toggle('is-front');
                    cardElement.classList.toggle('is-back');
                });

                cardContainer.querySelector('.card-image-wrap').addEventListener('click', (e) => {
                    e.stopPropagation();
                    modalZoomImage.src = photoSrc;
                    imageModal.style.display = 'flex';
                });

                grid.appendChild(cardContainer);
            });
        }

        filterContainer.addEventListener('click', (e) => {
            if(e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentFaction = e.target.getAttribute('data-faction');
                renderRoles();
            }
        });

        searchInput.addEventListener('input', renderRoles);

        closeImageModal.addEventListener('click', () => { imageModal.style.display = 'none'; });
        imageModal.addEventListener('click', (e) => { if(e.target === imageModal) imageModal.style.display = 'none'; });

        fetchRoles();
    </script>
</body>
</html>
