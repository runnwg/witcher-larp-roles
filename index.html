<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сетка ролей — Ведьмак: Праздник бочки (Туссент)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --toussaint-bg: #110709;
            --toussaint-panel: #1e0d11;
            --toussaint-panel-card: #190a0e;
            --wine-dark: #2a0b10;
            --wine-deep: #44121a;
            --gold: #d4af37;
            --gold-light: #fbe8a6;
            --gold-dark: #997a22;
            --text-main: #f0eae1;
            --text-muted: #b5a495;
            --card-border: #c5a03d;
            --card-back-bg: #1c090e;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--toussaint-bg);
            color: var(--text-main);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(85, 21, 32, 0.35) 0%, transparent 60%),
                radial-gradient(circle at 20% 90%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 90%, rgba(140, 40, 55, 0.1) 0%, transparent 50%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            border-bottom: 2px solid transparent;
            border-image: linear-gradient(to right, transparent, var(--gold), transparent) 1;
            background: linear-gradient(to bottom, rgba(30, 13, 17, 0.9), transparent);
        }
        .subtitle-ornament {
            font-family: 'Cinzel', serif;
            color: var(--gold-dark);
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        h1 {
            font-family: 'Cinzel Decorative', serif;
            color: var(--gold-light);
            font-size: 2.6rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.9), 0 0 20px rgba(212, 175, 55, 0.2);
        }
        .sync-status {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 10px;
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
        }
        .sync-status.online { color: #7cb342; }
        .sync-status.syncing { color: var(--gold); }
        .sync-status.error { color: #e53935; }

        .controls-wrapper {
            max-width: 1200px;
            margin: 0 auto 40px auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .search-box {
            flex: 1;
            min-width: 280px;
        }
        .search-box input {
            width: 100%;
            padding: 14px 22px;
            background: var(--toussaint-panel);
            border: 2px solid var(--gold-dark);
            color: var(--text-main);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.15rem;
            border-radius: 8px;
            outline: none;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .search-box input:focus {
            border-color: var(--gold);
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.8), 0 0 15px rgba(212, 175, 55, 0.3);
        }
        .toussaint-btn {
            background: linear-gradient(135deg, #3d0e16 0%, #1a0609 100%);
            border: 2px solid var(--gold);
            color: var(--gold-light);
            padding: 14px 28px;
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.7), inset 0 0 15px rgba(212, 175, 55, 0.25);
            transition: all 0.35s ease;
            text-transform: uppercase;
        }
        .toussaint-btn span {
            font-size: 1.3rem;
            color: var(--gold);
        }
        .toussaint-btn:hover {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: #110709;
            border-color: var(--gold-light);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
            transform: translateY(-2px);
        }
        .toussaint-btn:hover span {
            color: #110709;
        }
        .filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .filter-btn {
            background: var(--toussaint-panel);
            border: 1px solid var(--gold-dark);
            color: var(--text-muted);
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 1px;
            border-radius: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .filter-btn:hover, .filter-btn.active {
            background: linear-gradient(135deg, var(--wine-deep), var(--wine-dark));
            color: var(--gold-light);
            border-color: var(--gold);
            font-weight: 600;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            transform: translateY(-1px);
        }
        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 40px;
            justify-items: center;
        }
        
        /* Стили карточки (без переворота в пространстве, чистая смена сторон) */
        .card-container {
            width: 270px;
            height: 420px;
            cursor: pointer;
            position: relative;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 12px;
            border: 3px solid var(--card-border);
            overflow: hidden;
            background: var(--toussaint-panel-card);
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            transition: filter 0.3s ease;
        }
        .card-container:hover .card {
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
        .card-side {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: opacity 0.3s ease;
        }
        
        /* Состояние сторон карточки */
        .card.is-front .card-back-side {
            opacity: 0;
            pointer-events: none;
        }
        .card.is-back .card-front-side {
            opacity: 0;
            pointer-events: none;
        }
        .card.is-front .card-front-side {
            opacity: 1;
            z-index: 2;
        }
        .card.is-back .card-back-side {
            opacity: 1;
            z-index: 2;
        }

        /* Лицевая сторона */
        .card-front-side {
            z-index: 1;
        }
        .card-image-wrap {
            width: 100%;
            height: 70%;
            position: relative;
            border-bottom: 2px solid var(--gold-dark);
            overflow: hidden;
        }
        .card-front-side img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }
        .card-container:hover .card-front-side img {
            transform: scale(1.06);
        }
        .faction-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(17, 7, 9, 0.9);
            border: 1px solid var(--gold);
            color: var(--gold-light);
            padding: 5px 10px;
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            border-radius: 5px;
            letter-spacing: 1.2px;
            z-index: 2;
            box-shadow: 0 3px 8px rgba(0,0,0,0.6);
        }
        .card-front-info {
            padding: 14px;
            text-align: center;
            background: linear-gradient(to bottom, #240b10, #130508);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .char-name {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .player-name {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-style: italic;
        }
        .flip-hint {
            font-size: 0.7rem;
            color: var(--gold-dark);
            margin-top: 6px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Cinzel', serif;
            flex-shrink: 0;
            text-align: center;
        }

        /* Обратная сторона (чисто текст, без фото) */
        .card-back-side {
            background: var(--card-back-bg);
            background-image: 
                radial-gradient(circle at center, rgba(68, 18, 26, 0.5) 0%, rgba(17, 7, 9, 0.95) 100%),
                repeating-linear-gradient(45deg, rgba(212, 175, 55, 0.02) 0, rgba(212, 175, 55, 0.02) 2px, transparent 0, transparent 4px);
            color: var(--text-main);
            padding: 16px;
            z-index: 1;
        }
        .card-back-content {
            border: 1px dashed rgba(212, 175, 55, 0.4);
            height: 100%;
            padding: 12px;
            display: flex;
            flex-direction: column;
            background: rgba(11, 7, 9, 0.4);
            border-radius: 6px;
            overflow: hidden;
        }
        .card-back-side h3 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 1.05rem;
            border-bottom: 1px solid var(--gold-dark);
            padding-bottom: 6px;
            margin-bottom: 8px;
            text-align: center;
            flex-shrink: 0;
        }
        .card-scroll-area {
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 4px;
            margin-bottom: 6px;
            scrollbar-width: thin;
            scrollbar-color: var(--gold-dark) transparent;
        }
        .card-scroll-area::-webkit-scrollbar {
            width: 5px;
        }
        .card-scroll-area::-webkit-scrollbar-thumb {
            background-color: var(--gold-dark);
            border-radius: 4px;
        }
        .card-back-side p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-main);
            text-align: justify;
            white-space: pre-wrap;
        }

        .empty-notice {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            font-style: italic;
            font-size: 1.2rem;
            border: 1px dashed var(--gold-dark);
            border-radius: 10px;
            width: 100%;
            background: rgba(30, 13, 17, 0.4);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 4, 6, 0.88);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--toussaint-panel);
            border: 3px solid var(--gold);
            padding: 35px;
            width: 100%;
            max-width: 520px;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9), 0 0 30px rgba(212, 175, 55, 0.2);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            margin-bottom: 25px;
            text-align: center;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--gold-dark);
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            color: var(--gold);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            background: var(--toussaint-bg);
            border: 1px solid var(--gold-dark);
            color: var(--text-main);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            border-radius: 6px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
        }
        .form-group input[type="file"] {
            padding: 8px;
            cursor: pointer;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8), 0 0 10px rgba(212, 175, 55, 0.2);
        }
        .form-group textarea {
            resize: vertical;
            height: 120px;
        }
        .submit-btn {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: var(--toussaint-bg);
            border: none;
            padding: 14px 20px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 0.95rem;
            letter-spacing: 1px;
            cursor: pointer;
            width: 100%;
            border-radius: 6px;
            transition: all 0.3s ease;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            text-transform: uppercase;
        }
        .submit-btn:hover {
            background: var(--gold-light);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.8rem;
            font-family: sans-serif;
            transition: color 0.3s;
        }
        .close-modal:hover {
            color: var(--gold);
        }
    </style>
</head>
<body>

    <header>
        <div class="subtitle-ornament">Княжество Туссент • Земля любви и вина</div>
        <h1>Праздник Бочки</h1>
        <div id="syncStatus" class="sync-status">Подключение к общей летописи...</div>
    </header>

    <div class="controls-wrapper">
        <div class="top-action-bar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Поиск благородного гостя или персонажа...">
            </div>
            <button class="toussaint-btn" id="openModalBtn">
                <span>⚔</span> Добавить роль
            </button>
        </div>
        <div class="filters" id="filterContainer">
            <button class="filter-btn active" data-faction="all">Все благородные</button>
            <button class="filter-btn" data-faction="Де Бельгаард">Де Бельгаард</button>
            <button class="filter-btn" data-faction="Де Туффо">Де Туффо</button>
            <button class="filter-btn" data-faction="Де Кастиль Ровелло">Де Кастиль Ровелло</button>
            <button class="filter-btn" data-faction="Гости">Гости</button>
        </div>
    </div>

    <div class="grid" id="cardsGrid"></div>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <h2>Добавить персонажа</h2>
            <form id="addRoleForm">
                <div class="form-group">
                    <label>Имя персонажа</label>
                    <input type="text" id="charNameInput" required placeholder="Например: Граф де Бельгаард">
                </div>
                <div class="form-group">
                    <label>Имя игрока</label>
                    <input type="text" id="playerNameInput" required placeholder="Например: Иван">
                </div>
                <div class="form-group">
                    <label>Фракция / Дом</label>
                    <select id="factionInput">
                        <option value="Де Бельгаард">Де Бельгаард</option>
                        <option value="Де Туффо">Де Туффо</option>
                        <option value="Де Кастиль Ровелло">Де Кастиль Ровелло</option>
                        <option value="Гости">Гости</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Портрет (фотография)</label>
                    <input type="file" id="photoInput" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>Квента, цели и секреты (на оборот карточки)</label>
                    <textarea id="descInput" required placeholder="Опишите характер, тайны и владения персонажа..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Занести в летопись</button>
            </form>
        </div>
    </div>

    <script>
        // Использование бесплатного публичного хранилища JSONbin для общей синхронизации между всеми игроками
        const BIN_ID = '673a5a7ead19ca34f8c9b3a1'; // Общий демо-бин (для реальной игры вы можете создать свой бесплатный аккаунт на jsonbin.io и заменить ID)
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        let roles = [];
        const syncStatus = document.getElementById('syncStatus');

        async function fetchRoles() {
            syncStatus.textContent = "Синхронизация с летописью...";
            syncStatus.className = "sync-status syncing";
            try {
                const response = await fetch(API_URL, {
                    headers: {
                        // Публичный доступ на чтение
                        'X-Master-Key': '$2a$10$C1Jz6YV8TjZ5pYfN2gW5n.8G6OqW9lX8Ue5qW3V8U9v6Z2b7x5V9W' 
                    }
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.record && Array.isArray(data.record.roles)) {
                        roles = data.record.roles;
                    } else if (Array.isArray(data.record)) {
                        roles = data.record;
                    }
                    syncStatus.textContent = "Летопись актуальна (общий доступ)";
                    syncStatus.className = "sync-status online";
                    renderRoles();
                } else {
                    throw new Error("Ошибка сервера");
                }
            } catch(e) {
                console.warn("Облако недоступно, переходим в автономный режим:", e);
                syncStatus.textContent = "Автономный режим (локальное хранилище)";
                syncStatus.className = "sync-status error";
                // Резервный вариант на случай проблем с сетью
                const local = localStorage.getItem('witcher_larp_roles_fallback');
                if (local) roles = JSON.parse(local);
                renderRoles();
            }
        }

        async function saveRolesToCloud() {
            syncStatus.textContent = "Сохранение в общую летопись...";
            syncStatus.className = "sync-status syncing";
            
            // Дублируем в локальный бэкап
            localStorage.setItem('witcher_larp_roles_fallback', JSON.stringify(roles));

            try {
                const response = await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': '$2a$10$C1Jz6YV8TjZ5pYfN2gW5n.8G6OqW9lX8Ue5qW3V8U9v6Z2b7x5V9W'
                    },
                    body: JSON.stringify({ roles: roles })
                });
                if(response.ok) {
                    syncStatus.textContent = "Изменения сохранены для всех";
                    syncStatus.className = "sync-status online";
                } else {
                    throw new Error("Не удалось записать в облако");
                }
            } catch(e) {
                console.error("Ошибка сохранения в облако:", e);
                syncStatus.textContent = "Сохранено локально (нет связи с облаком)";
                syncStatus.className = "sync-status error";
            }
        }

        const grid = document.getElementById('cardsGrid');
        const searchInput = document.getElementById('searchInput');
        const filterContainer = document.getElementById('filterContainer');
        const addModal = document.getElementById('addModal');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModal = document.getElementById('closeModal');
        const addRoleForm = document.getElementById('addRoleForm');

        let currentFaction = 'all';

        function renderRoles() {
            grid.innerHTML = '';
            const searchText = searchInput.value.toLowerCase();

            const filtered = roles.filter(role => {
                const matchesFaction = currentFaction === 'all' || role.faction === currentFaction;
                const matchesSearch = (role.charName || '').toLowerCase().includes(searchText) || (role.playerName || '').toLowerCase().includes(searchText);
                return matchesFaction && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-notice">В данной летописи пока не найдено благородных персон. Нажмите «Добавить роль», чтобы вписать их имена.</div>`;
                return;
            }

            filtered.forEach(role => {
                const cardContainer = document.createElement('div');
                cardContainer.className = 'card-container';
                cardContainer.innerHTML = `
                    <div class="card is-front">
                        <!-- Лицевая сторона (фото, имя персонажа и игрока) -->
                        <div class="card-side card-front-side">
                            <div class="card-image-wrap">
                                <span class="faction-badge">${role.faction}</span>
                                <img src="${role.photo}" alt="${role.charName}" onerror="this.src='https://via.placeholder.com/300x400?text=No+Photo'">
                            </div>
                            <div class="card-front-info">
                                <div class="char-name">${role.charName}</div>
                                <div class="player-name">Игрок: ${role.playerName}</div>
                                <div class="flip-hint">Нажми, чтобы прочитать квенту</div>
                            </div>
                        </div>
                        <!-- Обратная сторона (только текстовое поле описания с прокруткой) -->
                        <div class="card-side card-back-side">
                            <div class="card-back-content">
                                <h3>${role.charName}</h3>
                                <div class="card-scroll-area">
                                    <p>${role.description}</p>
                                </div>
                                <div class="flip-hint">Вернуть карточку</div>
                            </div>
                        </div>
                    </div>
                `;

                const cardElement = cardContainer.querySelector('.card');
                cardContainer.addEventListener('click', () => {
                    cardElement.classList.toggle('is-front');
                    cardElement.classList.toggle('is-back');
                });

                grid.appendChild(cardContainer);
            });
        }

        filterContainer.addEventListener('click', (e) => {
            if(e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentFaction = e.target.getAttribute('data-faction');
                renderRoles();
            }
        });

        searchInput.addEventListener('input', renderRoles);

        openModalBtn.addEventListener('click', () => {
            addModal.style.display = 'flex';
        });

        closeModal.addEventListener('click', () => {
            addModal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if(e.target === addModal) {
                addModal.style.display = 'none';
            }
        });

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400; // Оптимизация размера изображения для быстрой загрузки в облако
                    const scaleSize = MAX_WIDTH / img.width;
                    
                    canvas.width = (img.width > MAX_WIDTH) ? MAX_WIDTH : img.width;
                    canvas.height = (img.width > MAX_WIDTH) ? img.height * scaleSize : img.height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    callback(dataUrl);
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        addRoleForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const photoInput = document.getElementById('photoInput');
            const file = photoInput.files[0];

            if(file) {
                compressImage(file, function(compressedDataUrl) {
                    const newRole = {
                        id: Date.now(),
                        charName: document.getElementById('charNameInput').value,
                        playerName: document.getElementById('playerNameInput').value,
                        faction: document.getElementById('factionInput').value,
                        photo: compressedDataUrl,
                        description: document.getElementById('descInput').value
                    };

                    roles.push(newRole);
                    saveRolesToCloud();
                    renderRoles();

                    addRoleForm.reset();
                    addModal.style.display = 'none';
                });
            }
        });

        // Запуск загрузки данных при старте
        fetchRoles();

        // Периодическая проверка обновлений от других участников каждые 15 секунд
        setInterval(fetchRoles, 15000);
    </script>
</body>
</html>
